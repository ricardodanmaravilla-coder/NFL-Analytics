name: Descargar Historico NFL

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 12 * * 2' 

# 👇 ESTE ES EL PERMISO CLAVE QUE FALTABA
permissions:
  contents: write

jobs:
  actualizar-nfl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install pandas nfl_data_py fastparquet
          
      - name: Ejecutar Extractor NFL
        run: python descargar_historico_nfl.py
        
      - name: Guardar CSVs en GitHub (Commit y Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull origin main --rebase
          git add data/historico_nfl_games.csv data/historico_nfl_qbs.csv
          git commit -m "🏈 Automatización: Bases de datos NFL actualizadas" || echo "Sin cambios nuevos para guardar"
          git push origin main
