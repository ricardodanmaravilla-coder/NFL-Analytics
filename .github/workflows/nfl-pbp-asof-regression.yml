name: NFL PBP AsOf Regression
on:
  push:
    paths:
      - 'modules/nfl_pbp_engine.py'
      - 'test_nfl_pbp_asof.py'
      - '.github/workflows/nfl-pbp-asof-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pytest
      - run: pytest -q test_nfl_pbp_asof.py
