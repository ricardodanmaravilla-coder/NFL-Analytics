name: NFL Shadow Safety Tests
on:
  push:
    paths:
      - 'nfl_shadow_monitor.py'
      - 'cloudrun_api.py'
      - 'test_nfl_shadow_monitor.py'
      - 'nfl_independent_live_monitor.py'
      - 'test_nfl_independent_live_monitor.py'
      - '.github/workflows/nfl-shadow-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_nfl_shadow_monitor.py test_nfl_independent_live_monitor.py
      - run: python -m compileall -q cloudrun_api.py nfl_shadow_monitor.py nfl_independent_live_monitor.py
