name: NFL Independent Shadow Monitor
on:
  push:
    paths:
      - 'nfl_independent_live_monitor.py'
      - 'nfl_shadow_dashboard.py'
      - '.github/workflows/nfl-shadow-monitor.yml'
  workflow_dispatch:
    inputs:
      season:
        description: 'Optional season'
        required: false
      week:
        description: 'Optional NFL week'
        required: false
  schedule:
    # Sunday 08:00 America/Mexico_City (UTC-6)
    - cron: '0 14 * * 0'
permissions:
  contents: write
  id-token: write
concurrency:
  group: nfl-shadow-monitor
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q nfl_shadow_monitor.py nfl_independent_live_monitor.py nfl_shadow_dashboard.py
      - name: Authenticate to Google Cloud for private Cloud Run
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/664101772310/locations/global/workloadIdentityPools/nfl-github-pool/providers/github-nfl
          service_account: id-nfl-independent-runner@nfl-analytics-506819.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://nfl-analytics-664101772310.northamerica-south1.run.app
          id_token_include_email: true
      - name: Capture predictions and settle prior picks
        env:
          NFL_SHADOW_API: https://nfl-analytics-664101772310.northamerica-south1.run.app
          NFL_SHADOW_ID_TOKEN: ${{ steps.gcp_auth.outputs.id_token }}
          SEASON: ${{ github.event.inputs.season }}
          WEEK: ${{ github.event.inputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${SEASON:-}" && -n "${WEEK:-}" ]]; then
            python nfl_independent_live_monitor.py --season "$SEASON" --week "$WEEK"
          else
            python nfl_independent_live_monitor.py
          fi
      - name: Update readable dashboard
        run: python nfl_shadow_dashboard.py
      - name: Persist append-only monitoring records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_shadow/
          if git diff --cached --quiet; then
            echo "No new shadow records"
            exit 0
          fi
          git commit -m "data(nfl): append shadow observations and settled results"
          git fetch origin main
          if ! git rebase origin/main; then
            if git ls-files -u | grep -q 'data/nfl_shadow/PANEL_NFL.md'; then
              git checkout --theirs -- data/nfl_shadow/PANEL_NFL.md
              git add data/nfl_shadow/PANEL_NFL.md
              GIT_EDITOR=true git rebase --continue
            else
              exit 1
            fi
          fi
          git push origin main

# Sunday backup schedule and push-triggered recovery run, 2026-10-25.
