name: NFL TheRundown Validation

on:
  pull_request:
    paths:
      - 'modules/nfl_therundown_odds.py'
      - 'cloudrun_api.py'
      - 'test_nfl_therundown_odds.py'
      - '.github/workflows/nfl-therundown-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime test dependencies
        run: pip install requests pytest
      - name: Compile provider and Cloud Run API
        run: python -m py_compile modules/nfl_therundown_odds.py cloudrun_api.py test_nfl_therundown_odds.py
      - name: Run provider regression tests
        run: pytest -q test_nfl_therundown_odds.py
      - name: Guard live-price policy
        run: |
          # Producción debe obtener una cotización TheRundown por juego; el objeto
          # incluye únicamente mercados reales que el proveedor haya entregado.
          grep -q 'quote = get_moneyline(home, away' cloudrun_api.py
          grep -q 'NO BET - sin mercados reales de TheRundown' cloudrun_api.py

          # Los tres mercados deben salir del quote real, nunca de nflverse.
          grep -q 'quote.get("home_moneyline")' cloudrun_api.py
          grep -q 'quote.get("home_spread")' cloudrun_api.py
          grep -q 'quote.get("total_line")' cloudrun_api.py
          grep -q 'quote.get("over_odds")' cloudrun_api.py
          grep -q 'quote.get("under_odds")' cloudrun_api.py

          # Monte Carlo debe recibir la línea real de total y el umbral del spread.
          grep -q 'simular_nfl_montecarlo(home, away, past_games, total_line, spread_threshold)' cloudrun_api.py

          # Política histórica: nunca volver a tomar Moneyline del schedule nflverse.
          ! grep -q 'hm, am = num(g.get("home_moneyline"))' cloudrun_api.py
