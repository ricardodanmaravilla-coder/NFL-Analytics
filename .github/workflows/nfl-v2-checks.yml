name: NFL V2 checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Refresh real nflverse schedule data
        run: python descargar_historico_nfl.py
      - name: Refresh real nflverse play-by-play
        run: python descargar_pbp_nfl.py
      - name: Compile
        run: python -m py_compile app_nfl.py app_nfl_final.py backtest_nfl_v2.py backtest_nfl_value_v2.py backtest_nfl_pbp_v1.py test_streamlit_nfl_v2.py modules/*.py descargar_historico_nfl.py descargar_pbp_nfl.py
      - name: PBP data integrity
        run: |
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('data/historico_nfl_pbp_team_game.csv')
          required={'game_id','season','week','team','off_epa_play','off_success_rate','pass_epa','rush_epa','explosive_rate','def_epa_allowed','pressure_rate'}
          assert required.issubset(p.columns)
          assert len(p) > 1500
          assert p['off_epa_play'].notna().mean() > 0.95
          assert p['off_success_rate'].between(0,1).mean() > 0.95
          print(p.groupby('season').size().to_dict())
          PY
      - name: ML PBP and empirical engines smoke
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.nfl_ml_engine import PredictorNFL_ML
          from modules.nfl_montecarlo_sim import simular_nfl_montecarlo
          from modules.nfl_xgb_engine import PredictorXGBoostSpread
          df=pd.read_csv('data/historico_nfl_games.csv')
          pbp=pd.read_csv('data/historico_nfl_pbp_team_game.csv')
          ml=PredictorNFL_ML(); assert ml.entrenar(df,df_pbp_team_game=pbp)
          assert ml.usa_pbp is True
          r=ml.predecir_contexto(1,'KC','BUF',None,None,False,7,7)
          assert r and r['Usa_PBP_Real'] is True and r['PBP_Aplicado_A']=='Margen/Moneyline'
          assert r['Sigma_Total_OOS'] and r['Sigma_Margen_OOS']
          emp=simular_nfl_montecarlo('KC','BUF',df,47.5,2.5)
          assert emp['Disponible'] is True
          x=PredictorXGBoostSpread(); assert x.entrenar(df)
          print(r, emp['Moneyline'], x.oos_accuracy, x.oos_brier)
          PY
      - name: Base chronological predictive backtest
        shell: bash
        run: |
          set -o pipefail
          python backtest_nfl_v2.py | tee /tmp/backtest.txt
      - name: Base 2025 real-odds value backtest
        shell: bash
        run: |
          set -o pipefail
          python backtest_nfl_value_v2.py | tee /tmp/value_backtest.txt
      - name: Base vs PBP matched/hybrid backtest
        shell: bash
        run: |
          set -o pipefail
          python backtest_nfl_pbp_v1.py | tee /tmp/pbp_backtest.txt
      - name: Production Streamlit startup
        run: |
          streamlit run app_nfl.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          READY=0
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/streamlit.log; kill $PID || true; exit 1; fi
          kill $PID || true
      - name: Real Streamlit interaction smoke
        run: python test_streamlit_nfl_v2.py
      - name: Conservative production guardrails
        run: |
          grep -q 'PBP real' app_nfl_final.py
          grep -q 'pendiente backtest PBP' app_nfl_final.py
          ! grep -R "spread_to_ml" app_nfl.py app_nfl_final.py
          ! grep -R 'return 1.91' app_nfl.py app_nfl_final.py modules
          ! grep -R 'fillna(-3.0)' modules/nfl_xgb_engine.py
          ! grep -R "df\['total'\].*total_line" modules/nfl_xgb_engine.py
