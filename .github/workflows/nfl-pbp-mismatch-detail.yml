name: NFL PBP Mismatch Root Audit
on:
  push:
    paths: ['audit_nfl_pbp_mismatch_detail.py','.github/workflows/nfl-pbp-mismatch-detail.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python audit_nfl_pbp_mismatch_detail.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-pbp-mismatch-detail
          path: audit_nfl_pbp_mismatch_detail.json
