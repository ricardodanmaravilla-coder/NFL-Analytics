name: NFL Independent Probability Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit_nfl_independent_probabilities.py'
      - '.github/workflows/nfl-independent-probability-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q audit_nfl_independent_probabilities.py
      - run: python audit_nfl_independent_probabilities.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-independent-probability-audit
          path: nfl_independent_probability_audit.csv
          if-no-files-found: warn
