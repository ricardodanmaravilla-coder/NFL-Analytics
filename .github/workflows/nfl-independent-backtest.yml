name: NFL Independent Walkforward Backtest
on:
  push:
    paths:
      - 'backtest_nfl_independent_walkforward.py'
      - '.github/workflows/nfl-independent-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Historical season-held-out evaluation
        run: python backtest_nfl_independent_walkforward.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-independent-walkforward-audit
          path: data/nfl_shadow/independent_backtest_audit.json
