name: NFL Independent Settlement
on:
  workflow_dispatch:
  schedule:
    # Sunday 22:00 Mexico City = Monday 04:00 UTC
    - cron: '0 4 * * 1'
    # Monday 22:00 Mexico City = Tuesday 04:00 UTC
    - cron: '0 4 * * 2'
permissions:
  contents: write
concurrency:
  group: nfl-independent-settlement
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate syntax
        run: python -m compileall -q nfl_independent_live_monitor.py nfl_shadow_dashboard.py
      - name: Settle final independent picks only
        run: python -c "import nfl_independent_live_monitor as m; print({'settled': m.settle()})"
      - name: Update readable dashboard
        run: python nfl_shadow_dashboard.py
      - name: Persist settled results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_shadow/
          if git diff --cached --quiet; then
            echo "No newly settled picks"
            exit 0
          fi
          git commit -m "data(nfl): settle independent picks"
          git fetch origin main
          git rebase origin/main
          git push origin main
