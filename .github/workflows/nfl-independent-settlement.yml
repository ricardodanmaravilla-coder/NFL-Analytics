name: NFL Independent Settlement

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nfl-independent-settlement.yml"
  schedule:
    - cron: "0 4 * * 1"
    - cron: "0 4 * * 2"

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Settle independent picks
        run: python -c "import nfl_independent_live_monitor as m; print(m.settle())"
      - name: Build dashboard
        run: python nfl_shadow_dashboard.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_shadow/
          git diff --cached --quiet && exit 0
          git commit -m "data(nfl): settle independent picks"
          git pull --rebase origin main
          git push origin main
