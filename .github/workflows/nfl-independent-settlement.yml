name: NFL Independent Settlement

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
    - cron: "0 4 * * 2"

permissions:
  contents: read

concurrency:
  group: nfl-independent-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle independent Sheet via Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://nfl-analytics-664101772310.northamerica-south1.run.app/api/settle-independent"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 "$ENDPOINT")"
          echo "$response"
          python - "$response" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit(f"Independent settlement failed: {data}")
          print(f"Independent settlement OK | settled={data.get('settled',0)} | pending={data.get('pending',0)}")
          PY
