name: Deploy NFL Analytics to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCP_PROJECT_ID: nfl-analytics-engine
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: nfl-predictor

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo "Missing repository secret: GCP_SA_KEY"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Compile production entrypoint
        run: python -m py_compile cloudrun_api.py cloudrun_entrypoint.py modules/nfl_google_sheets.py

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --allow-unauthenticated \
            --quiet

      - name: Resolve service URL
        id: service
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: $URL"

      - name: Health check
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsS "$SERVICE_URL/health"; then
              echo
              echo "Deployment healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
