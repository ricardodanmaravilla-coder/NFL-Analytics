name: NFL Production All Markets Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_spread_direct_ats.py'
      - 'backtest_nfl_spread_ats_adaptive.py'
      - '.github/workflows/nfl-production-all-markets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile adaptive ATS
        run: python -m compileall modules backtest_nfl_spread_direct_ats.py backtest_nfl_spread_ats_adaptive.py
      - name: Run adaptive ATS validation
        run: python backtest_nfl_spread_ats_adaptive.py
      - name: Upload adaptive ATS
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ats-adaptive-results
          path: |
            backtest_nfl_spread_direct_ats_results.csv
            backtest_nfl_spread_ats_adaptive_all.csv
            backtest_nfl_spread_ats_adaptive_results.csv
