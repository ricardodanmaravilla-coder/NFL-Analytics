name: NFL Production All Markets Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_production_all_markets.py'
      - 'modules/nfl_pbp_engine.py'
      - 'modules/nfl_moneyline_runtime.py'
      - '.github/workflows/nfl-production-all-markets.yml'

permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile production validation
        run: python -m compileall modules backtest_nfl_production_all_markets.py
      - name: Run production all-markets walk-forward 2023-2025
        run: python backtest_nfl_production_all_markets.py
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-production-all-markets-results
          path: backtest_nfl_production_all_markets_results.csv
