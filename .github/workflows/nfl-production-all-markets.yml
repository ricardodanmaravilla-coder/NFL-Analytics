name: NFL Production All Markets Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_production_all_markets.py'
      - 'cloudrun_api.py'
      - 'modules/nfl_calibration.py'
      - 'modules/nfl_google_sheets.py'
      - 'modules/nfl_montecarlo_sim.py'
      - 'modules/nfl_pbp_engine.py'
      - 'modules/nfl_moneyline_runtime.py'
      - 'modules/nfl_production_history.py'
      - 'modules/nfl_therundown_odds.py'
      - '.github/workflows/nfl-production-all-markets.yml'

permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        season: [2023, 2024, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile production validation
        run: python -m compileall modules backtest_nfl_production_all_markets.py
      - name: Run rigorous walk-forward for season
        env:
          NFL_VALIDATION_SEASON: ${{ matrix.season }}
        run: python backtest_nfl_production_all_markets.py
      - name: Upload season validation results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-production-all-markets-${{ matrix.season }}
          path: backtest_nfl_production_all_markets_results.csv
