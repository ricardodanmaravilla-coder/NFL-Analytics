name: NFL Production All Markets Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_spread_direct_ats.py'
      - 'backtest_nfl_spread_direct_ats_v2.py'
      - 'diagnose_nfl_spread_regime.py'
      - '.github/workflows/nfl-production-all-markets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile diagnostics
        run: python -m compileall modules backtest_nfl_spread_direct_ats.py diagnose_nfl_spread_regime.py
      - name: Run ATS regime diagnostics
        run: python diagnose_nfl_spread_regime.py
      - name: Upload regime diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ats-regime-diagnostics
          path: |
            backtest_nfl_spread_direct_ats_results.csv
            diagnose_nfl_spread_regime_results.csv
            diagnose_nfl_spread_drift_results.csv
