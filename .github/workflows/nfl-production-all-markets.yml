name: NFL Production All Markets Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_spread_direct_ats.py'
      - 'backtest_nfl_spread_ats_calibrated.py'
      - 'diagnose_nfl_ats_calibration.py'
      - '.github/workflows/nfl-production-all-markets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile calibration audit
        run: python -m compileall modules backtest_nfl_spread_direct_ats.py diagnose_nfl_ats_calibration.py
      - name: Run calibration suppression audit
        run: python diagnose_nfl_ats_calibration.py
      - name: Upload calibration audit
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ats-calibration-audit
          path: |
            backtest_nfl_spread_direct_ats_results.csv
            diagnose_nfl_ats_calibration_all.csv
            diagnose_nfl_ats_calibration_summary.csv
