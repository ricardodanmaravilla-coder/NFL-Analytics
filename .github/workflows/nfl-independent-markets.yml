name: NFL Independent Markets Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'modules/nfl_independent_markets.py'
      - 'backtest_nfl_independent_markets.py'
      - '.github/workflows/nfl-independent-markets.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q modules/nfl_independent_markets.py backtest_nfl_independent_markets.py
      - run: python backtest_nfl_independent_markets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-independent-market-comparison
          path: nfl_independent_markets_results.csv
          if-no-files-found: warn
