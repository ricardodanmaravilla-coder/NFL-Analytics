name: NFL Market Residual ATS Validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest_nfl_spread_market_residual.py'
      - '.github/workflows/nfl-market-residual-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile ATS v5
        run: python -m compileall modules backtest_nfl_spread_market_residual.py
      - name: Run market baseline correction ATS v5
        run: python backtest_nfl_spread_market_residual.py
      - name: Upload ATS v5 results
        uses: actions/upload-artifact@v4
        with:
          name: nfl-market-baseline-ats-v5
          path: |
            backtest_nfl_spread_market_residual_results.csv
            backtest_nfl_spread_market_residual_all.csv
