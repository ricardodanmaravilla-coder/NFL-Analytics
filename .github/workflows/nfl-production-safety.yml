name: NFL Production Safety

on:
  push:
    paths:
      - 'cloudrun_api.py'
      - 'cloudrun_entrypoint.py'
      - 'modules/nfl_calibration.py'
      - 'modules/nfl_google_sheets.py'
      - 'modules/nfl_moneyline_runtime.py'
      - 'modules/nfl_montecarlo_sim.py'
      - 'modules/nfl_pbp_engine.py'
      - 'modules/nfl_production_history.py'
      - 'modules/nfl_therundown_odds.py'
      - 'test_nfl_production_safety.py'
      - 'test_nfl_pbp_asof.py'
      - '.github/workflows/nfl-production-safety.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-cloudrun.txt pytest
      - name: Compile production modules
        run: python -m py_compile cloudrun_api.py modules/nfl_moneyline_runtime.py modules/nfl_pbp_engine.py
      - name: Run production safety regressions
        run: pytest -q test_nfl_production_safety.py test_nfl_pbp_asof.py
